<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111e" />
      <stop offset="50%" stop-color="#0b1b30" />
      <stop offset="100%" stop-color="#050a12" />
    </linearGradient>

    <linearGradient id="msBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a4ef" />
      <stop offset="100%" stop-color="#0078d4" />
    </linearGradient>

    <radialGradient id="msAura" cx="75%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0078d4" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00a4ef" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#07111e" stop-opacity="0" />
    </radialGradient>

    <filter id="msShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgMs)" />
  <rect width="640" height="360" fill="url(#msAura)" />

  <!-- Grid Tech Lines -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Right Visual: Microsoft Emblem & Office Suite Hub -->
  <g transform="translate(425, 52)" filter="url(#msShadow)">
    <circle cx="95" cy="112" r="110" fill="url(#msBlueGrad)" opacity="0.12" />
    <circle cx="95" cy="112" r="88" fill="#0d1f36" stroke="rgba(0, 164, 239, 0.35)" stroke-width="2" />

    <!-- Microsoft 4 Squares Official Logo -->
    <g transform="translate(57, 74)">
      <rect x="0" y="0" width="36" height="36" fill="#f25022" rx="3" />
      <rect x="40" y="0" width="36" height="36" fill="#7fba00" rx="3" />
      <rect x="0" y="40" width="36" height="36" fill="#00a4ef" rx="3" />
      <rect x="40" y="40" width="36" height="36" fill="#ffb900" rx="3" />
    </g>

    <!-- App Badges Orbit -->
    <g transform="translate(25, 218)">
      <rect width="140" height="28" rx="14" fill="#0b1728" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="70" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#60cdff" text-anchor="middle" letter-spacing="0.5">OFFICE + 1 TB ONEDRIVE</text>
    </g>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(42, 42)">
    <!-- Header Pill -->
    <g transform="translate(0, 0)">
      <rect width="200" height="34" rx="17" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <g transform="translate(14, 10)">
        <rect x="0" y="0" width="6" height="6" fill="#f25022" />
        <rect x="8" y="0" width="6" height="6" fill="#7fba00" />
        <rect x="0" y="8" width="6" height="6" fill="#00a4ef" />
        <rect x="8" y="8" width="6" height="6" fill="#ffb900" />
      </g>
      <text x="36" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="0.5">Microsoft 365</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.02em">
      Microsoft 365
    </text>
    <text x="0" y="112" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#60cdff">
      Premium · 12 Meses Oficial
    </text>

    <!-- Highlights Features Grid -->
    <g transform="translate(0, 138)">
      <g transform="translate(0, 0)">
        <rect width="170" height="64" rx="14" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(0, 164, 239, 0.3)" stroke-width="1.2" />
        <text x="16" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#00a4ef">1 TB</text>
        <text x="16" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Nuvem OneDrive Segura</text>
      </g>

      <g transform="translate(182, 0)">
        <rect width="180" height="64" rx="14" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(127, 186, 0, 0.3)" stroke-width="1.2" />
        <text x="16" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#7fba00">Word, Excel, PPT</text>
        <text x="16" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Outlook & PC/Mac/Celular</text>
      </g>
    </g>

    <!-- Bottom Verification Checks -->
    <g transform="translate(0, 235)">
      <g transform="translate(0, 0)">
        <circle cx="8" cy="8" r="6" fill="#00a4ef" />
        <polyline points="5,8 7,10 11,6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
        <text x="22" y="12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Ativação na sua Conta Oficial</text>
      </g>

      <g transform="translate(230, 0)">
        <circle cx="8" cy="8" r="6" fill="#00a4ef" />
        <polyline points="5,8 7,10 11,6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
        <text x="22" y="12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Pagamento Único Sem Renovação</text>
      </g>
    </g>
  </g>
</svg>
