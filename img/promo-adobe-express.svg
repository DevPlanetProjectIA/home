<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAdobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14071f" />
      <stop offset="50%" stop-color="#1a0b2e" />
      <stop offset="100%" stop-color="#090310" />
    </linearGradient>

    <linearGradient id="adobeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="50%" stop-color="#9b51e0" />
      <stop offset="100%" stop-color="#ff7a00" />
    </linearGradient>

    <radialGradient id="adobeAura" cx="75%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#9b51e0" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ff3366" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#090310" stop-opacity="0" />
    </radialGradient>

    <filter id="adobeShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgAdobe)" />
  <rect width="640" height="360" fill="url(#adobeAura)" />

  <!-- Subtle Blueprint Tech Lines -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Right Visual: Adobe Express Emblem & Firefly Sparkle -->
  <g transform="translate(425, 52)" filter="url(#adobeShadow)">
    <circle cx="95" cy="112" r="110" fill="url(#adobeGrad)" opacity="0.15" />
    <circle cx="95" cy="112" r="88" fill="#1b0c30" stroke="url(#adobeGrad)" stroke-width="2.5" />

    <!-- Adobe "A" Stylized Icon Vector -->
    <g transform="translate(60, 68)">
      <rect width="70" height="70" rx="16" fill="url(#adobeGrad)" />
      <path d="M 18,52 L 35,16 L 52,52 L 42,52 L 35,36 L 27,52 Z" fill="#ffffff" />
      <polygon points="35,26 40,36 30,36" fill="url(#adobeGrad)" opacity="0.3" />
    </g>

    <!-- Adobe Firefly AI Sparkle -->
    <g transform="translate(138, 70) scale(0.6)">
      <path d="M 0,-30 Q 0,0 30,0 Q 0,0 0,30 Q 0,0 -30,0 Q 0,0 0,-30 Z" fill="#ffcc00" />
    </g>

    <g transform="translate(25, 218)">
      <rect width="140" height="28" rx="14" fill="#150824" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="70" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#f472b6" text-anchor="middle" letter-spacing="0.5">ADOBE FIREFLY IA</text>
    </g>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(42, 42)">
    <!-- Header Pill -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="17" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <rect x="12" y="10" width="14" height="14" rx="3" fill="#ff3366" />
      <text x="34" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="0.5">Adobe Express</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.02em">
      Adobe Express
    </text>
    <text x="0" y="112" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#e879f9">
      Premium Anual · 12 Meses
    </text>

    <!-- Highlights Features Grid -->
    <g transform="translate(0, 138)">
      <g transform="translate(0, 0)">
        <rect width="170" height="64" rx="14" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(232, 121, 249, 0.3)" stroke-width="1.2" />
        <text x="16" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#e879f9">Firefly IA</text>
        <text x="16" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Preenchimento Generativo</text>
      </g>

      <g transform="translate(182, 0)">
        <rect width="180" height="64" rx="14" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 122, 0, 0.3)" stroke-width="1.2" />
        <text x="16" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#ff7a00">+25.000 Fontes</text>
        <text x="16" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Adobe Stock + Vídeos</text>
      </g>
    </g>

    <!-- Bottom Verification Checks -->
    <g transform="translate(0, 235)">
      <g transform="translate(0, 0)">
        <circle cx="8" cy="8" r="6" fill="#ec4899" />
        <polyline points="5,8 7,10 11,6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
        <text x="22" y="12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Removedor de Fundo em 1 Clique</text>
      </g>

      <g transform="translate(245, 0)">
        <circle cx="8" cy="8" r="6" fill="#ec4899" />
        <polyline points="5,8 7,10 11,6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
        <text x="22" y="12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Pagamento Único Sem Renovação</text>
      </g>
    </g>
  </g>
</svg>
