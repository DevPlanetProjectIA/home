<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgLovable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0514" />
      <stop offset="50%" stop-color="#140a24" />
      <stop offset="100%" stop-color="#05020a" />
    </linearGradient>

    <linearGradient id="lovableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a5f" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <radialGradient id="lovableAura" cx="75%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0a0514" stop-opacity="0" />
    </radialGradient>

    <filter id="lovableShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgLovable)" />
  <rect width="640" height="360" fill="url(#lovableAura)" />

  <!-- Code/Tech Matrix Grid -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Right Visual: Lovable Heart Core &amp; AI Dev Node -->
  <g transform="translate(425, 52)" filter="url(#lovableShadow)">
    <circle cx="95" cy="112" r="110" fill="url(#lovableGrad)" opacity="0.14" />
    <circle cx="95" cy="112" r="88" fill="#130822" stroke="url(#lovableGrad)" stroke-width="2.5" />

    <!-- Lovable Glowing Heart Vector -->
    <g transform="translate(95, 108)">
      <path d="M 0,28 C -36,-10 -46,-36 -23,-50 C -5,-60 0,-40 0,-40 C 0,-40 5,-60 23,-50 C 46,-36 36,-10 0,28 Z" fill="url(#lovableGrad)" />
      <!-- Inner Sparkle -->
      <circle cx="-10" cy="-35" r="4" fill="#ffffff" opacity="0.6" />
    </g>

    <g transform="translate(25, 218)">
      <rect width="140" height="28" rx="14" fill="#150824" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="70" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#f43f5e" text-anchor="middle" letter-spacing="0.5">DEV IA FULL-STACK</text>
    </g>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(42, 42)">
    <!-- Header Pill -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="17" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <circle cx="20" cy="17" r="6" fill="#ff2a5f" />
      <text x="34" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="0.5">Lovable.dev IA</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.02em">
      Lovable Lite
    </text>
    <text x="0" y="112" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#f43f5e">
      Assinatura Oficial · 12 Meses
    </text>

    <!-- Highlights Features Grid -->
    <g transform="translate(0, 138)">
      <g transform="translate(0, 0)">
        <rect width="170" height="64" rx="14" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 42, 95, 0.3)" stroke-width="1.2" />
        <text x="16" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#ff2a5f">Apps Full-Stack</text>
        <text x="16" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Frontend + Backend + DB</text>
      </g>

      <g transform="translate(182, 0)">
        <rect width="180" height="64" rx="14" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.2" />
        <text x="16" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#a855f7">Sync GitHub</text>
        <text x="16" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Código Seu + Deploy Fácil</text>
      </g>
    </g>

    <!-- Bottom Verification Checks -->
    <g transform="translate(0, 235)">
      <g transform="translate(0, 0)">
        <circle cx="8" cy="8" r="6" fill="#ff2a5f" />
        <polyline points="5,8 7,10 11,6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
        <text x="22" y="12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Crie Softwares Conversando com a IA</text>
      </g>

      <g transform="translate(265, 0)">
        <circle cx="8" cy="8" r="6" fill="#ff2a5f" />
        <polyline points="5,8 7,10 11,6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
        <text x="22" y="12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Sem Mensalidade em Dólar</text>
      </g>
    </g>
  </g>
</svg>
