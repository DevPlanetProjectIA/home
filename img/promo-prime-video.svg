<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPrime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b14" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#02060c" />
    </linearGradient>

    <linearGradient id="primeBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8e1" />
      <stop offset="100%" stop-color="#0080b0" />
    </linearGradient>

    <radialGradient id="primeAura" cx="75%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#00a8e1" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#006699" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#040b14" stop-opacity="0" />
    </radialGradient>

    <filter id="primeShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgPrime)" />
  <rect width="640" height="360" fill="url(#primeAura)" />

  <!-- Subtle Blueprint Tech Lines -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90" />
    <line x1="0" y1="180" x2="640" y2="180" />
    <line x1="0" y1="270" x2="640" y2="270" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <!-- Right Visual: Prime Video Visual & Smile Curve -->
  <g transform="translate(425, 52)" filter="url(#primeShadow)">
    <circle cx="95" cy="112" r="110" fill="url(#primeBlueGrad)" opacity="0.12" />
    <circle cx="95" cy="112" r="88" fill="#0c1e36" stroke="rgba(0, 168, 225, 0.4)" stroke-width="2" />

    <!-- Prime Play Button & Smile Curve Symbol -->
    <g transform="translate(68, 72)">
      <!-- Play Triangle -->
      <polygon points="18,10 48,28 18,46" fill="#00a8e1" />
      <!-- Amazon Smile Arrow Vector -->
      <path d="M 4,56 Q 30,76 56,58" fill="none" stroke="#ff9900" stroke-width="4.5" stroke-linecap="round" />
      <polygon points="58,54 59,62 52,60" fill="#ff9900" />
    </g>

    <g transform="translate(25, 218)">
      <rect width="140" height="28" rx="14" fill="#081424" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="70" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">FILMES & SÉRIES 4K</text>
    </g>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(42, 42)">
    <!-- Header Pill -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="17" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <circle cx="20" cy="17" r="6" fill="#00a8e1" />
      <text x="34" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="0.5">Prime Video</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.02em">
      Prime Video
    </text>
    <text x="0" y="112" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#38bdf8">
      Assinatura Oficial · 6 Meses
    </text>

    <!-- Highlights Features Grid -->
    <g transform="translate(0, 138)">
      <g transform="translate(0, 0)">
        <rect width="170" height="64" rx="14" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(0, 168, 225, 0.3)" stroke-width="1.2" />
        <text x="16" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#00a8e1">4K Ultra HD</text>
        <text x="16" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Qualidade Máxima & HDR</text>
      </g>

      <g transform="translate(182, 0)">
        <rect width="180" height="64" rx="14" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 153, 0, 0.3)" stroke-width="1.2" />
        <text x="16" y="28" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#ff9900">3 Telas Simul.</text>
        <text x="16" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Download para Offline</text>
      </g>
    </g>

    <!-- Bottom Verification Checks -->
    <g transform="translate(0, 235)">
      <g transform="translate(0, 0)">
        <circle cx="8" cy="8" r="6" fill="#00a8e1" />
        <polyline points="5,8 7,10 11,6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
        <text x="22" y="12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Séries Exclusivas Amazon Originals</text>
      </g>

      <g transform="translate(260, 0)">
        <circle cx="8" cy="8" r="6" fill="#00a8e1" />
        <polyline points="5,8 7,10 11,6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
        <text x="22" y="12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Sem Mensalidade</text>
      </g>
    </g>
  </g>
</svg>
