<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="planetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="24" cy="24" r="20" fill="url(#planetGlow)" />

  <!-- Back half of the orbital ring -->
  <path d="M 6 29 C 4 25, 7 21, 14 18 C 22 15, 33 15, 41 18 C 44 19, 45 21, 44 23" 
        stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />

  <!-- Planet Sphere -->
  <circle cx="24" cy="24" r="14" fill="url(#planetGrad)" filter="url(#iconShadow)" />

  <!-- Planet Surface Atmosphere Arc / Shadow -->
  <path d="M 14 17 A 14 14 0 0 0 34 33 A 14 14 0 0 1 14 17 Z" fill="#1e1b4b" opacity="0.45" />

  <!-- Subtle Latitude Rings on Planet -->
  <ellipse cx="24" cy="24" rx="14" ry="5" stroke="rgba(255,255,255,0.2)" stroke-width="0.75" stroke-dasharray="2 2" fill="none" transform="rotate(-15 24 24)" />

  <!-- Front half of the orbital ring (crosses over planet) -->
  <path d="M 44 23 C 44 26, 40 29, 32 32 C 24 35, 13 35, 6 29" 
        stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Core Tech Sparkle (Spark/Star in center of planet) -->
  <g transform="translate(24, 24) scale(0.7)">
    <polygon points="0,-9 2.5,-2.5 9,0 2.5,2.5 0,9 -2.5,2.5 -9,0 -2.5,-2.5" fill="#ffffff" />
    <circle cx="0" cy="0" r="1.5" fill="#a5f3fc" />
  </g>
</svg>
